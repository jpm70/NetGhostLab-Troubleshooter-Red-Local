<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Top Header Bar -->
  <rect x="0" y="0" width="1200" height="58" fill="#020617" stroke="#1e293b" stroke-width="1"/>
  <rect x="28" y="14" width="30" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="36" y="34" fill="#38bdf8" class="mono" font-size="14" font-weight="700">&gt;_</text>
  <text x="68" y="35" fill="#f8fafc" class="sans" font-size="16" font-weight="700">Un Fantasma en el Sistema — NetGhost Lab</text>
  <text x="490" y="34" fill="#cbd5e1" class="sans" font-size="13" font-weight="500">Casos Prácticos   ·   Topología LAN   ·   Metodología TCP/IP   ·   Web Oficial</text>
  <rect x="1010" y="14" width="162" height="30" rx="8" fill="#0ea5e9"/>
  <text x="1032" y="33" fill="#020617" class="sans" font-size="12" font-weight="700">Nuevo Caso Aleatorio</text>

  <!-- Scenario Selector Banner -->
  <rect x="28" y="76" width="1144" height="108" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="48" y="102" fill="#94a3b8" class="sans" font-size="12">Simulador de Diagnóstico de Redes Locales  ·  Nivel: Básico  ·  10 Escenarios Progresivos</text>
  <text x="48" y="128" fill="#ffffff" class="sans" font-size="20" font-weight="700">01. Aislado del Exterior — <tspan fill="#38bdf8">Puerta de enlace en otra subred</tspan></text>
  <rect x="48" y="144" width="190" height="26" rx="6" fill="#0ea5e9"/>
  <text x="60" y="161" fill="#020617" class="sans" font-size="11" font-weight="700">Caso 01: Aislado del Exterior</text>
  <rect x="246" y="144" width="210" height="26" rx="6" fill="#020617" stroke="#1e293b"/>
  <text x="258" y="161" fill="#cbd5e1" class="sans" font-size="11">Caso 02: El Falso Corte de Internet</text>
  <rect x="464" y="144" width="205" height="26" rx="6" fill="#020617" stroke="#1e293b"/>
  <text x="476" y="161" fill="#cbd5e1" class="sans" font-size="11">Caso 03: Fantasmas en el Switch</text>
  <rect x="677" y="144" width="235" height="26" rx="6" fill="#020617" stroke="#1e293b"/>
  <text x="689" y="161" fill="#cbd5e1" class="sans" font-size="11">Caso 04: El Muro Invisible (/25)</text>
  <rect x="920" y="144" width="232" height="26" rx="6" fill="#020617" stroke="#1e293b"/>
  <text x="932" y="161" fill="#cbd5e1" class="sans" font-size="11">Caso 08: El Expediente APIPA</text>

  <!-- Main Topology Card -->
  <rect x="28" y="200" width="1144" height="450" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="48" y="228" fill="#94a3b8" class="mono" font-size="12">Topología Lógica Ethernet · Segmento LAN 192.168.1.0/24</text>
  <text x="48" y="250" fill="#f8fafc" class="sans" font-size="17" font-weight="700">Mapa de Red y Estado de Nodos en Tiempo Real</text>
  <rect x="960" y="220" width="190" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="978" y="238" fill="#38bdf8" class="sans" font-size="11" font-weight="600">Vista Docente: IPs Visibles</text>

  <!-- Row 1: Router, Switch, Internet -->
  <!-- Router Card -->
  <rect x="48" y="270" width="356" height="125" rx="8" fill="#020617" stroke="#1e293b"/>
  <text x="66" y="296" fill="#38bdf8" class="sans" font-size="14" font-weight="700">Router-GW (Puerta de Enlace)</text>
  <rect x="290" y="280" width="98" height="22" rx="4" fill="#1e293b"/>
  <text x="300" y="295" fill="#7dd3fc" class="mono" font-size="11">ping 192.168.1.1</text>
  <text x="66" y="324" fill="#94a3b8" class="mono" font-size="12">IP Interfaz LAN:      <tspan fill="#f8fafc">192.168.1.1</tspan></text>
  <text x="66" y="344" fill="#94a3b8" class="mono" font-size="12">Máscara LAN:          <tspan fill="#e2e8f0">255.255.255.0 (/24)</tspan></text>
  <text x="66" y="364" fill="#94a3b8" class="mono" font-size="12">IP Pública WAN:       <tspan fill="#cbd5e1">83.44.192.14</tspan></text>
  <text x="66" y="382" fill="#94a3b8" class="mono" font-size="11">MAC Router:           <tspan fill="#64748b">00:1A:2B:00:01:01</tspan></text>

  <!-- Switch Card -->
  <rect x="422" y="270" width="356" height="125" rx="8" fill="#020617" stroke="#1e293b"/>
  <text x="440" y="296" fill="#34d399" class="sans" font-size="14" font-weight="700">Switch-Core L2 (8 Puertos)</text>
  <text x="680" y="295" fill="#34d399" class="mono" font-size="11">Capa 2 Activa</text>
  <rect x="440" y="314" width="320" height="36" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <text x="454" y="336" fill="#94a3b8" class="mono" font-size="11">P1:PC-01   <tspan fill="#38bdf8" font-weight="700">[P2:PC-02]</tspan>   P3:PC-03   P4:SRV-NAS</text>
  <text x="440" y="376" fill="#94a3b8" class="sans" font-size="12">Conmutación por tabla MAC (ARP) · VLAN 1</text>

  <!-- Internet WAN Card -->
  <rect x="796" y="270" width="356" height="125" rx="8" fill="#020617" stroke="#1e293b"/>
  <text x="814" y="296" fill="#818cf8" class="sans" font-size="14" font-weight="700">Internet WAN y Servidores DNS</text>
  <rect x="1050" y="280" width="88" height="22" rx="4" fill="#1e293b"/>
  <text x="1060" y="295" fill="#a5b4fc" class="mono" font-size="11">ping 8.8.8.8</text>
  <text x="814" y="324" fill="#94a3b8" class="mono" font-size="12">DNS Públicos OK:      <tspan fill="#6ee7b7">8.8.8.8 · 1.1.1.1</tspan></text>
  <text x="814" y="344" fill="#94a3b8" class="mono" font-size="12">DNS Secundarios:      <tspan fill="#cbd5e1">8.8.4.4 · 9.9.9.9</tspan></text>
  <text x="814" y="364" fill="#94a3b8" class="mono" font-size="12">Dominio Web:          <tspan fill="#38bdf8">unfantasmaenelsistema.com</tspan></text>
  <text x="814" y="382" fill="#94a3b8" class="mono" font-size="11">IP Servidor Web:      <tspan fill="#cbd5e1">185.199.108.153</tspan></text>

  <!-- Live Packet Trace Banner -->
  <rect x="48" y="408" width="1104" height="34" rx="6" fill="#451a03" stroke="#f59e0b" stroke-opacity="0.5"/>
  <text x="64" y="429" fill="#fde68a" class="sans" font-size="12" font-weight="600">Traza ICMP (PC-02 → 8.8.8.8): La puerta de enlace configurada (192.168.2.1) no pertenece a la subred 192.168.1.0/24.</text>

  <!-- Row 2: 4 LAN Host Cards -->
  <!-- PC-01 -->
  <rect x="48" y="456" width="264" height="174" rx="10" fill="#020617" stroke="#1e293b"/>
  <text x="64" y="482" fill="#f8fafc" class="mono" font-size="14" font-weight="700">PC-01</text>
  <text x="64" y="498" fill="#94a3b8" class="sans" font-size="11">Recepción</text>
  <text x="236" y="484" fill="#34d399" class="sans" font-size="11" font-weight="600">✓ Operativo</text>
  <text x="64" y="524" fill="#94a3b8" class="mono" font-size="12">IPv4:       <tspan fill="#f8fafc">192.168.1.10</tspan></text>
  <text x="64" y="544" fill="#94a3b8" class="mono" font-size="12">Máscara:    <tspan fill="#e2e8f0">255.255.255.0</tspan></text>
  <text x="64" y="564" fill="#94a3b8" class="mono" font-size="12">Gateway:    <tspan fill="#e2e8f0">192.168.1.1</tspan></text>
  <text x="64" y="584" fill="#94a3b8" class="mono" font-size="12">DNS:        <tspan fill="#e2e8f0">8.8.8.8</tspan></text>
  <text x="64" y="614" fill="#34d399" class="mono" font-size="11">✓ LAN  ·  ✓ GW  ·  ✓ WAN  ·  ✓ DNS</text>

  <!-- PC-02 (Selected, with Silent Fault) -->
  <rect x="328" y="456" width="264" height="174" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="2"/>
  <text x="344" y="482" fill="#38bdf8" class="mono" font-size="14" font-weight="700">PC-02 [Activo]</text>
  <text x="344" y="498" fill="#94a3b8" class="sans" font-size="11">Contabilidad (Marta)</text>
  <text x="514" y="484" fill="#fbbf24" class="sans" font-size="11" font-weight="600">! Incidencia</text>
  <text x="344" y="524" fill="#94a3b8" class="mono" font-size="12">IPv4:       <tspan fill="#f8fafc">192.168.1.11</tspan></text>
  <text x="344" y="544" fill="#94a3b8" class="mono" font-size="12">Máscara:    <tspan fill="#e2e8f0">255.255.255.0</tspan></text>
  <text x="344" y="564" fill="#94a3b8" class="mono" font-size="12">Gateway:    <tspan fill="#fb7185" font-weight="700">192.168.2.1</tspan></text>
  <text x="344" y="584" fill="#94a3b8" class="mono" font-size="12">DNS:        <tspan fill="#e2e8f0">8.8.8.8</tspan></text>
  <text x="344" y="614" fill="#34d399" class="mono" font-size="11">✓ LAN  ·  ✓ GW  ·  <tspan fill="#fb7185">✗ WAN</tspan>  ·  <tspan fill="#fb7185">✗ DNS</tspan></text>

  <!-- PC-03 -->
  <rect x="608" y="456" width="264" height="174" rx="10" fill="#020617" stroke="#1e293b"/>
  <text x="624" y="482" fill="#f8fafc" class="mono" font-size="14" font-weight="700">PC-03</text>
  <text x="624" y="498" fill="#94a3b8" class="sans" font-size="11">Diseño</text>
  <text x="796" y="484" fill="#34d399" class="sans" font-size="11" font-weight="600">✓ Operativo</text>
  <text x="624" y="524" fill="#94a3b8" class="mono" font-size="12">IPv4:       <tspan fill="#f8fafc">192.168.1.12</tspan></text>
  <text x="624" y="544" fill="#94a3b8" class="mono" font-size="12">Máscara:    <tspan fill="#e2e8f0">255.255.255.0</tspan></text>
  <text x="624" y="564" fill="#94a3b8" class="mono" font-size="12">Gateway:    <tspan fill="#e2e8f0">192.168.1.1</tspan></text>
  <text x="624" y="584" fill="#94a3b8" class="mono" font-size="12">DNS:        <tspan fill="#e2e8f0">8.8.8.8</tspan></text>
  <text x="624" y="614" fill="#34d399" class="mono" font-size="11">✓ LAN  ·  ✓ GW  ·  ✓ WAN  ·  ✓ DNS</text>

  <!-- SRV-NAS -->
  <rect x="888" y="456" width="264" height="174" rx="10" fill="#020617" stroke="#1e293b"/>
  <text x="904" y="482" fill="#f8fafc" class="mono" font-size="14" font-weight="700">SRV-NAS</text>
  <text x="904" y="498" fill="#94a3b8" class="sans" font-size="11">Archivos Locales</text>
  <text x="1076" y="484" fill="#34d399" class="sans" font-size="11" font-weight="600">✓ Operativo</text>
  <text x="904" y="524" fill="#94a3b8" class="mono" font-size="12">IPv4:       <tspan fill="#f8fafc">192.168.1.50</tspan></text>
  <text x="904" y="544" fill="#94a3b8" class="mono" font-size="12">Máscara:    <tspan fill="#e2e8f0">255.255.255.0</tspan></text>
  <text x="904" y="564" fill="#94a3b8" class="mono" font-size="12">Gateway:    <tspan fill="#e2e8f0">192.168.1.1</tspan></text>
  <text x="904" y="584" fill="#94a3b8" class="mono" font-size="12">DNS:        <tspan fill="#e2e8f0">8.8.8.8</tspan></text>
  <text x="904" y="614" fill="#34d399" class="mono" font-size="11">✓ LAN  ·  ✓ GW  ·  ✓ WAN  ·  ✓ DNS</text>
</svg>
