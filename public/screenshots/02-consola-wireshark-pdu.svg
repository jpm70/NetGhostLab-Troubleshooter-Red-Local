<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" fill="none">
  <defs>
    <style>
      .sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="620" fill="#020617"/>

  <!-- Left Panel: Interactive CLI Console -->
  <rect x="24" y="24" width="564" height="572" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <rect x="24" y="24" width="564" height="52" rx="12" fill="#020617" stroke="#1e293b"/>
  <text x="44" y="55" fill="#38bdf8" class="sans" font-size="14" font-weight="700">&gt;_ Consola CLI Interactiva  ·  PC-02 (Contabilidad)</text>

  <!-- Quick Commands Strip -->
  <rect x="24" y="76" width="564" height="38" fill="#0f172a" stroke="#1e293b"/>
  <text x="42" y="99" fill="#94a3b8" class="mono" font-size="11">[ipconfig /all]  [ping 192.168.1.1]  [ping 8.8.8.8]  [nslookup]  [tracert]  [arp -a]</text>

  <!-- CLI Output Lines -->
  <text x="42" y="140" fill="#38bdf8" class="mono" font-size="12" font-weight="700">C:\Users\Admin@PC-02&gt; <tspan fill="#ffffff">ipconfig /all</tspan></text>
  <text x="52" y="164" fill="#cbd5e1" class="mono" font-size="11.5">Adaptador de Ethernet Ethernet0:</text>
  <text x="52" y="184" fill="#cbd5e1" class="mono" font-size="11.5">   Dirección física (MAC). . . . . . : 00:1A:2B:AA:10:02</text>
  <text x="52" y="204" fill="#cbd5e1" class="mono" font-size="11.5">   Dirección IPv4. . . . . . . . . . : 192.168.1.11 (Preferido)</text>
  <text x="52" y="224" fill="#cbd5e1" class="mono" font-size="11.5">   Máscara de subred . . . . . . . . : 255.255.255.0 (/24)</text>
  <text x="52" y="244" fill="#fbbf24" class="mono" font-size="11.5">   Puerta de enlace predeterminada . : 192.168.2.1</text>
  <text x="52" y="264" fill="#cbd5e1" class="mono" font-size="11.5">   Servidores DNS. . . . . . . . . . : 8.8.8.8</text>
  <text x="52" y="284" fill="#38bdf8" class="mono" font-size="11.5">   Red calculada por el host . . . . : 192.168.1.0/24</text>

  <text x="42" y="324" fill="#38bdf8" class="mono" font-size="12" font-weight="700">C:\Users\Admin@PC-02&gt; <tspan fill="#ffffff">ping 8.8.8.8</tspan></text>
  <text x="52" y="346" fill="#fda4af" class="mono" font-size="11.5">Haciendo ping a 8.8.8.8 con 32 bytes de datos:</text>
  <text x="52" y="366" fill="#fda4af" class="mono" font-size="11.5">Respuesta desde 192.168.1.11: Host de destino inaccesible.</text>
  <text x="52" y="386" fill="#fda4af" class="mono" font-size="11.5">Respuesta desde 192.168.1.11: Host de destino inaccesible.</text>
  <text x="52" y="410" fill="#fb7185" class="mono" font-size="11">[Detalle: La puerta de enlace (192.168.2.1) no pertenece a 192.168.1.0/24]</text>

  <text x="42" y="450" fill="#38bdf8" class="mono" font-size="12" font-weight="700">C:\Users\Admin@PC-02&gt; <tspan fill="#ffffff">route print</tspan></text>
  <text x="52" y="472" fill="#fcd34d" class="mono" font-size="11">0.0.0.0   0.0.0.0   [INALCANZABLE: 192.168.2.1 fuera de 192.168.1.0/24]</text>
  <text x="52" y="492" fill="#cbd5e1" class="mono" font-size="11">192.168.1.0   255.255.255.0   En vínculo   192.168.1.11   281</text>

  <!-- CLI Input Bottom Bar -->
  <rect x="24" y="548" width="564" height="48" rx="8" fill="#020617" stroke="#1e293b"/>
  <text x="42" y="577" fill="#38bdf8" class="mono" font-size="12" font-weight="700">C:\Users\Admin@PC-02&gt; <tspan fill="#64748b">tracert www.unfantasmaenelsistema.com</tspan></text>

  <!-- Right Panel: Wireshark PDU Sniffer & Browser -->
  <rect x="612" y="24" width="564" height="572" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <rect x="612" y="24" width="564" height="52" rx="12" fill="#020617" stroke="#1e293b"/>
  <text x="634" y="55" fill="#34d399" class="sans" font-size="14" font-weight="700">Analizador de Tramas PDU (Mini-Wireshark) &amp; Navegador</text>

  <!-- Packet Table Header -->
  <rect x="612" y="76" width="564" height="32" fill="#1e293b"/>
  <text x="630" y="96" fill="#cbd5e1" class="mono" font-size="11" font-weight="700">No.   Origen IP       Destino IP      Proto   Info de Trama</text>

  <!-- Packet Rows -->
  <rect x="612" y="108" width="564" height="32" fill="#020617"/>
  <text x="630" y="128" fill="#6ee7b7" class="mono" font-size="11">1     192.168.1.11    192.168.1.50    ARP     192.168.1.50 is at 00:1A:2B:AA:10:50</text>

  <rect x="612" y="140" width="564" height="32" fill="#0f172a"/>
  <text x="630" y="160" fill="#6ee7b7" class="mono" font-size="11">2     192.168.1.11    192.168.1.50    ICMP    Echo (ping) request id=0x01 ttl=64</text>

  <rect x="612" y="172" width="564" height="32" fill="#020617"/>
  <text x="630" y="192" fill="#6ee7b7" class="mono" font-size="11">3     192.168.1.50    192.168.1.11    ICMP    Echo (ping) reply id=0x01 ttl=64 (OK)</text>

  <rect x="612" y="204" width="564" height="32" fill="#0c4a6e"/>
  <text x="630" y="224" fill="#ffffff" class="mono" font-size="11" font-weight="700">4     192.168.1.11    192.168.10.250  DNS     Standard query A unfantasmaenelsistema.com</text>

  <rect x="612" y="236" width="564" height="32" fill="#4c0519"/>
  <text x="630" y="256" fill="#fda4af" class="mono" font-size="11">5     192.168.1.11    192.168.10.250  DNS     [DNS Timeout] Sin respuesta UDP/53</text>

  <!-- OSI Layer Decoder Box -->
  <rect x="628" y="286" width="532" height="128" rx="8" fill="#020617" stroke="#334155"/>
  <text x="644" y="310" fill="#38bdf8" class="sans" font-size="12" font-weight="700">Decodificación de Capas OSI (Trama #4 seleccionada)</text>
  <text x="644" y="334" fill="#cbd5e1" class="mono" font-size="11">[Capa 2 Ethernet] Src: 00:1A:2B:BB:20:03 (PC-03) → Dst: 00:1A:2B:00:10:01</text>
  <text x="644" y="356" fill="#e2e8f0" class="mono" font-size="11">[Capa 3 Red IPv4] Src: 192.168.10.22 → Dst: 192.168.10.250, TTL=64</text>
  <text x="644" y="378" fill="#6ee7b7" class="mono" font-size="11">[Capa 4/7 Datos]  UDP Src Port: 54122 → Dst Port: 53 (Domain Name System)</text>
  <text x="644" y="400" fill="#fbbf24" class="mono" font-size="10.5">Nota didáctica: La MAC destino para salir a Internet es siempre la MAC del Router.</text>

  <!-- Built-in Web Browser Preview -->
  <rect x="628" y="430" width="532" height="150" rx="8" fill="#020617" stroke="#1e293b"/>
  <rect x="642" y="444" width="390" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="656" y="462" fill="#e2e8f0" class="mono" font-size="11">https://www.unfantasmaenelsistema.com</text>
  <rect x="1042" y="444" width="102" height="28" rx="6" fill="#0ea5e9"/>
  <text x="1062" y="462" fill="#020617" class="sans" font-size="11" font-weight="700">Ir / Probar</text>
  <text x="644" y="498" fill="#fb7185" class="mono" font-size="12" font-weight="700">! ERR_NAME_NOT_RESOLVED</text>
  <text x="644" y="520" fill="#f8fafc" class="sans" font-size="13" font-weight="700">No se puede acceder a www.unfantasmaenelsistema.com</text>
  <text x="644" y="542" fill="#94a3b8" class="sans" font-size="11.5">El servidor DNS configurado no responde. Prueba a navegar por IP directa</text>
  <text x="644" y="560" fill="#38bdf8" class="mono" font-size="11.5">(http://185.199.108.153) para verificar que la salida IP sí funciona.</text>
</svg>
