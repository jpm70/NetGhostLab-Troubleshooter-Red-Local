<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" fill="none">
  <defs>
    <style>
      .sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="560" fill="#020617"/>

  <!-- Left Card: TCP/IPv4 Properties Editor -->
  <rect x="24" y="24" width="564" height="512" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <rect x="24" y="24" width="564" height="52" rx="12" fill="#020617" stroke="#1e293b"/>
  <text x="44" y="55" fill="#38bdf8" class="sans" font-size="14" font-weight="700">Propiedades de Internet Protocol versión 4 (TCP/IPv4)</text>

  <text x="44" y="104" fill="#94a3b8" class="sans" font-size="12">Editando adaptador Ethernet0 de <tspan fill="#38bdf8" class="mono" font-weight="700">PC-03</tspan> (Desarrollo) · MAC: 00:1A:2B:DD:50:30</text>

  <!-- Inputs Grid -->
  <text x="44" y="140" fill="#cbd5e1" class="sans" font-size="12" font-weight="600">Dirección IPv4:</text>
  <rect x="44" y="150" width="250" height="36" rx="8" fill="#020617" stroke="#334155"/>
  <text x="58" y="173" fill="#f8fafc" class="mono" font-size="13">192.168.50.30</text>

  <text x="314" y="140" fill="#cbd5e1" class="sans" font-size="12" font-weight="600">Máscara de subred:</text>
  <rect x="314" y="150" width="250" height="36" rx="8" fill="#020617" stroke="#0ea5e9"/>
  <text x="328" y="173" fill="#38bdf8" class="mono" font-size="13" font-weight="700">255.255.255.0</text>

  <text x="44" y="216" fill="#cbd5e1" class="sans" font-size="12" font-weight="600">Puerta de enlace predeterminada:</text>
  <rect x="44" y="226" width="250" height="36" rx="8" fill="#020617" stroke="#334155"/>
  <text x="58" y="249" fill="#f8fafc" class="mono" font-size="13">192.168.50.1</text>

  <text x="314" y="216" fill="#cbd5e1" class="sans" font-size="12" font-weight="600">Servidor DNS preferido:</text>
  <rect x="314" y="226" width="250" height="36" rx="8" fill="#020617" stroke="#334155"/>
  <text x="328" y="249" fill="#f8fafc" class="mono" font-size="13">8.8.8.8</text>

  <!-- Live Subnet Calculation Box -->
  <rect x="44" y="284" width="520" height="114" rx="8" fill="#020617" stroke="#1e293b"/>
  <text x="62" y="308" fill="#94a3b8" class="sans" font-size="12" font-weight="600">Cálculo en tiempo real según la IP y Máscara introducidas:</text>
  <text x="62" y="334" fill="#94a3b8" class="mono" font-size="12">Red calculada:           <tspan fill="#38bdf8" font-weight="700">192.168.50.0 /24</tspan></text>
  <text x="62" y="358" fill="#94a3b8" class="mono" font-size="12">Rango hosts útiles:      <tspan fill="#f8fafc">192.168.50.1 - 192.168.50.254</tspan></text>
  <text x="62" y="382" fill="#94a3b8" class="mono" font-size="12">Dirección Broadcast:     <tspan fill="#cbd5e1">192.168.50.255</tspan></text>

  <rect x="44" y="418" width="210" height="38" rx="8" fill="#0ea5e9"/>
  <text x="66" y="442" fill="#020617" class="sans" font-size="12" font-weight="700">Aplicar Cambios en PC-03</text>

  <rect x="44" y="472" width="520" height="44" rx="8" fill="#064e3b" stroke="#10b981" stroke-opacity="0.5"/>
  <text x="62" y="499" fill="#a7f3d0" class="sans" font-size="12" font-weight="600">✓ ¡Red Local 100% Operativa! Conectividad LAN, Gateway y DNS restablecida.</text>

  <!-- Right Card: 32-bit Binary Subnetting Inspector -->
  <rect x="612" y="24" width="564" height="512" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <rect x="612" y="24" width="564" height="52" rx="12" fill="#020617" stroke="#1e293b"/>
  <text x="634" y="55" fill="#38bdf8" class="sans" font-size="14" font-weight="700">3. Inspector Binario de Subred (Operación AND de 32 bits)</text>

  <text x="634" y="102" fill="#94a3b8" class="sans" font-size="12">Comparando <tspan fill="#38bdf8" class="mono" font-weight="700">PC-03 (192.168.50.30/25)</tspan> frente a <tspan fill="#fcd34d" class="mono" font-weight="700">SRV-NAS (192.168.50.200)</tspan>:</text>

  <rect x="634" y="122" width="520" height="240" rx="8" fill="#020617" stroke="#1e293b"/>
  <text x="652" y="148" fill="#38bdf8" class="sans" font-size="11" font-weight="600">Azul: Bits de Red (/25 = 25 bits)      ·      <tspan fill="#fcd34d">Ámbar: Bits de Host (7 bits = 126 hosts)</tspan></text>

  <text x="652" y="182" fill="#94a3b8" class="mono" font-size="11">IP PC-03 (.30):</text>
  <text x="802" y="182" fill="#38bdf8" class="mono" font-size="11" font-weight="700">11000000.10101000.00110010.0<tspan fill="#fcd34d">0011110</tspan></text>

  <text x="652" y="212" fill="#94a3b8" class="mono" font-size="11">Máscara (/25):</text>
  <text x="802" y="212" fill="#38bdf8" class="mono" font-size="11" font-weight="700">11111111.11111111.11111111.1<tspan fill="#fcd34d">0000000</tspan></text>

  <text x="652" y="248" fill="#7dd3fc" class="mono" font-size="11" font-weight="700">Red Origen (.0):</text>
  <text x="802" y="248" fill="#38bdf8" class="mono" font-size="11" font-weight="700">11000000.10101000.00110010.0<tspan fill="#fcd34d">0000000</tspan></text>

  <text x="652" y="290" fill="#94a3b8" class="mono" font-size="11">IP Destino (.200):</text>
  <text x="802" y="290" fill="#38bdf8" class="mono" font-size="11" font-weight="700">11000000.10101000.00110010.<tspan fill="#fb7185">1</tspan><tspan fill="#fcd34d">1001000</tspan></text>

  <text x="652" y="324" fill="#fbbf24" class="mono" font-size="11" font-weight="700">AND Destino (.128):</text>
  <text x="802" y="324" fill="#38bdf8" class="mono" font-size="11" font-weight="700">11000000.10101000.00110010.<tspan fill="#fb7185">1</tspan><tspan fill="#fcd34d">0000000</tspan></text>

  <!-- Binary Verdict Box -->
  <rect x="634" y="382" width="520" height="82" rx="8" fill="#451a03" stroke="#f59e0b" stroke-opacity="0.5"/>
  <text x="652" y="408" fill="#fde68a" class="sans" font-size="12" font-weight="700">Subred Distinta Detectada en el Bit #25:</text>
  <text x="652" y="430" fill="#fef3c7" class="sans" font-size="11.5">Los primeros 25 bits difieren (192.168.50.0 ≠ 192.168.50.128). PC-03 considera que</text>
  <text x="652" y="448" fill="#fef3c7" class="sans" font-size="11.5">192.168.50.200 pertenece a otra red y no le envía solicitudes ARP directas.</text>

  <rect x="634" y="480" width="250" height="36" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="656" y="503" fill="#38bdf8" class="sans" font-size="12" font-weight="600">↓ Exportar Informe Técnico (.md)</text>
</svg>
